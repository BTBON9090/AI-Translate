<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 极简翻译</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- 顶部导航 -->
    <header>
      <div class="brand">
        <span class="logo-icon">🌐</span>
        <h1 id="app-title">AI 精简翻译</h1>
      </div>
      
      <div class="header-controls" style="display:flex; align-items:center; gap:8px;">
        <!-- 语言切换按钮 -->
        <div id="lang-toggle" class="lang-btn">CN/EN</div>
        <div class="status-indicator ready" id="status-badge">Ready</div>
      </div>
    </header>

    <!-- 核心操作区 -->
    <main>
      <!-- 主按钮 -->
      <button id="main-action-btn" class="action-btn">
        <!-- <span class="btn-icon">✨</span> -->
        <!-- 使用 div 包裹主标题和副标题 -->
        <div class="btn-content-col">
          <span class="btn-text">翻译当前页面</span>
          <!-- 问题5：新增副标题用于回显模型名称 -->
          <span id="btn-model-display" class="btn-subtitle">Model: DeepSeek</span>
        </div>
      </button>

      <!-- 设置卡片 -->
      <div class="settings-card">
        <!-- 目标语言 -->
        <div class="setting-item">
          <label id="lbl-target-main">目标语言</label>
          <select id="target-lang" class="modern-select">
            <option value="zh">简体中文</option>
            <option value="en">English</option>
            <option value="zh-TW">繁體中文</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
            <option value="fr">Français</option>
            <option value="de">Deutsch</option>
            <option value="es">Español</option>
            <option value="ru">Русский</option>
            <option value="pt">Português</option>
            <option value="it">Italiano</option>
            <option value="nl">Nederlands</option>
            <option value="sv">Svenska</option>
            <option value="tr">Türkçe</option>
            <option value="pl">Polski</option>
            <option value="id">Bahasa Indonesia</option>
            <option value="th">ไทย</option>
            <option value="vi">Tiếng Việt</option>
            <option value="ms">Bahasa Melayu</option>
            <option value="ar">العربية</option>
            <option value="hi">हिन्दी</option>
            <option value="tr">Türkçe</option>
            <option value="ru">Русский</option>
          </select>
        </div>

        <!-- 新增：始终翻译当前网站 -->
        <div class="setting-item">
          <label style="display:flex; flex-direction:column;">
            <span id="lbl-auto-main">始终翻译此网站</span>
            <span id="current-host" style="font-size:10px; color:#94a3b8; font-weight:400;">Current Site</span>
          </label>
          <label class="switch">
            <input type="checkbox" id="auto-translate-site">
            <span class="slider"></span>
          </label>
        </div>

        <!-- 双语模式开关 -->
        <div class="setting-item">
          <label for="bilingual-mode" id="lbl-bi-mode">双语对照模式</label>
          <label class="switch">
            <input type="checkbox" id="bilingual-mode">
            <span class="slider"></span>
          </label>
        </div>

        <!-- 双语样式选择 (仅在双语开启时显示) -->
        <div class="setting-item sub-setting" id="style-setting-row">
          <label id="lbl-style">对照样式</label>
          <select id="trans-style" class="modern-select">
            <option value="minimal">极简 (宋体/灰字)</option>
            <option value="highlight">高亮 (蓝条/色块)</option>
          </select>
        </div>

        <!-- 新增：AI 精翻模式 -->
        <div class="setting-item">
          <label for="precision-mode">
            <span id="lbl-precision-main">AI 精翻模式</span>
            <span id="lbl-precision-sub" style="display:block; font-size:10px; color:#94a3b8; font-weight:400;">深度理解语境，更通顺但稍慢</span>
          </label>
          <label class="switch">
            <input type="checkbox" id="precision-mode">
            <span class="slider"></span>
          </label>
        </div>

        <!-- 悬浮球开关 -->
        <div class="setting-item">
          <label for="show-bubble" id="lbl-bubble">悬浮球入口</label>
          <label class="switch">
            <input type="checkbox" id="show-bubble">
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <!-- API 配置折叠区 -->
      <div class="api-section">
        <div class="accordion-header" id="toggle-api">
          <!-- 修改 1：给 span 加上 id -->
          <span id="lbl-api-header">🔑 DeepSeek API 配置</span>
          <svg class="chevron" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="accordion-content hidden" id="api-panel">
          
          <!-- 模型服务商 -->
          <div class="setting-item stacked" style="border:none; padding-bottom:0;">
            <label id="lbl-provider">模型服务商</label>
            <select id="provider-select" class="modern-select full-width-select">
              <!-- options 保持不变 -->
              <option value="deepseek">DeepSeek (默认)</option>
              <option value="openai">OpenAI (ChatGPT)</option>
              <option value="moonshot">Kimi (Moonshot)</option>
              <option value="qwen">阿里通义 (Qwen)</option>
              <option value="custom">自定义 (Custom)</option>
            </select>
          </div>

          <!-- 自定义参数区 -->
          <div id="custom-options" class="hidden" style="margin-top:10px; margin-bottom:12px; background:#f8fafc; padding:10px; border-radius:8px; border:1px solid #e2e8f0;">
            <div style="margin-bottom:8px;">
              <label style="font-size:11px; color:#64748b;">API URL</label>
              <div class="input-wrapper">
                <input type="text" id="custom-api-url" placeholder="https://...">
                <div class="icon-group">
                  <!-- 加上 icon-btn 类 -->
                  <div class="icon-btn clear-btn" data-target="custom-api-url">✕</div>
                </div>
              </div>
            </div>
            <div>
              <label style="font-size:11px; color:#64748b;">Model Name</label>
              <div class="input-wrapper">
                <input type="text" id="custom-model-name" placeholder="e.g. gpt-4">
                <div class="icon-group">
                  <!-- 加上 icon-btn 类 -->
                  <div class="icon-btn clear-btn" data-target="custom-model-name">✕</div>
                </div>
              </div>
            </div>
          </div>

          <!-- API Key 输入框 (确保结构完全一致) -->
          <div class="input-group" style="margin-top:10px; margin-bottom: 8px;">
            <div class="input-wrapper">
              <input type="password" id="api-key" placeholder="sk-..." autocomplete="off">
              <div class="icon-group">
                <!-- 加上 icon-btn 类，使用 ✕ 符号比 X 更像图标 -->
                <div class="icon-btn clear-btn" data-target="api-key">✕</div>
                <!-- 加上 icon-btn 和 eye-btn 类 -->
                <div class="icon-btn eye-btn" id="toggle-visibility">
                  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                </div>
              </div>
            </div>
          </div>
          
          <div class="api-tips" id="lbl-api-tips">Key 仅保存在本地，不会上传。</div>
          <button id="save-key-btn" class="save-btn">保存配置</button>
        </div>
      </div>
    </main>
  </div>
  <script src="popup.js"></script>
</body>
</html>
