<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 极简翻译</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <header>
      <div class="brand">
        <span class="logo-icon">🌐</span>
        <h1 id="app-title">AI 极简翻译</h1>
      </div>
      <div class="header-controls">
        <div id="lang-toggle" class="lang-btn">EN</div>
        <div class="status-indicator" id="status-badge">就绪</div>
      </div>
    </header>

    <main>
      <button id="main-action-btn" class="action-btn">
        <div class="btn-content-col">
          <span class="btn-text">翻译当前页面</span>
          <span id="btn-model-display" class="btn-subtitle">Model: DeepSeek</span>
        </div>
      </button>

      <div class="settings-card">
        <div class="setting-item">
          <label id="lbl-target-main">目标语言</label>
          <select id="target-lang" class="modern-select">
            <option value="zh">简体中文</option>
            <option value="en">English</option>
            <option value="zh-TW">繁體中文</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
            <option value="fr">Français</option>
            <option value="de">Deutsch</option>
            <option value="es">Español</option>
            <option value="ru">Русский</option>
            <option value="pt">Português</option>
            <option value="it">Italiano</option>
            <option value="nl">Nederlands</option>
            <option value="sv">Svenska</option>
            <option value="tr">Türkçe</option>
            <option value="pl">Polski</option>
            <option value="id">Bahasa Indonesia</option>
            <option value="th">ไทย</option>
            <option value="vi">Tiếng Việt</option>
            <option value="ms">Bahasa Melayu</option>
            <option value="ar">العربية</option>
            <option value="hi">हिन्दी</option>
          </select>
        </div>

        <div class="setting-item">
          <label>
            <span id="lbl-auto-main">始终翻译此网站</span>
            <span id="current-host" class="sub-label">—</span>
          </label>
          <label class="switch">
            <input type="checkbox" id="auto-translate-site">
            <span class="slider"></span>
          </label>
        </div>

        <div class="setting-item">
          <label for="bilingual-mode" id="lbl-bi-mode">双语对照</label>
          <label class="switch">
            <input type="checkbox" id="bilingual-mode">
            <span class="slider"></span>
          </label>
        </div>

        <div class="setting-item sub-setting" id="style-setting-row">
          <label id="lbl-style">对照样式</label>
          <select id="trans-style" class="modern-select">
            <option value="minimal">极简 (宋体/灰字)</option>
            <option value="highlight">高亮 (蓝条/色块)</option>
          </select>
        </div>

        <div class="setting-item">
          <label for="show-bubble" id="lbl-bubble">悬浮球入口</label>
          <label class="switch">
            <input type="checkbox" id="show-bubble">
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <div class="api-section">
        <div class="accordion-header" id="toggle-api">
          <span id="lbl-api-header">🔑 模型 API 配置</span>
          <svg class="chevron" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="accordion-content hidden" id="api-panel">
          <div class="setting-item stacked">
            <label id="lbl-provider">模型服务商</label>
            <select id="provider-select" class="modern-select full-width-select">
              <option value="deepseek">✨ DeepSeek 官方</option>
              <option value="moonshot">🌙 Kimi 官方</option>
              <option value="siliconflow">🚀 硅基流动</option>
              <option value="qwen">🟣 通义千问</option>
              <option value="zhipu">🎓 智谱 GLM</option>
              <option value="zhipu_free">🎓 智谱 GLM 免费版</option>
              <option value="custom">⚙️ 自定义</option>
            </select>
          </div>

          <div id="custom-options" class="custom-options">
            <div class="custom-field" id="model-name-row">
              <label id="lbl-model-name">模型名称</label>
              <div class="input-wrapper model-select-wrapper">
                <input type="text" id="custom-model-name" placeholder="e.g. deepseek-chat" autocomplete="off">
                <div class="icon-group">
                  <div class="icon-btn model-dropdown-btn" id="model-dropdown-btn" title="选择模型">▾</div>
                  <div class="icon-btn refresh-models-btn" id="refresh-models-btn" title="刷新模型列表">↻</div>
                  <div class="icon-btn clear-btn" data-target="custom-model-name">✕</div>
                </div>
                <div class="model-dropdown hidden" id="model-dropdown"></div>
              </div>
              <div class="field-tips" id="tips-model-name">留空则使用默认模型 · 点击 ▾ 选择或 ↻ 刷新</div>
            </div>
            <div class="custom-field hidden" id="custom-url-row">
              <label>API URL</label>
              <div class="input-wrapper">
                <input type="text" id="custom-api-url" placeholder="https://...">
                <div class="icon-group">
                  <div class="icon-btn clear-btn" data-target="custom-api-url">✕</div>
                </div>
              </div>
            </div>
          </div>

          <div class="api-key-area">
            <div class="input-wrapper">
              <input type="password" id="api-key" placeholder="sk-..." autocomplete="off">
              <div class="icon-group">
                <div class="icon-btn clear-btn" data-target="api-key">✕</div>
                <div class="icon-btn eye-btn" id="toggle-visibility">
                  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                </div>
              </div>
            </div>
            <div class="api-tips" id="lbl-api-tips">Key 仅保存在本地，不会上传服务器。</div>
            <button id="save-key-btn" class="save-btn">保存配置</button>
          </div>
        </div>
      </div>

      <div class="xhs-card">
        <div class="xhs-text">
          <div class="xhs-title">✨ 关注 & 支持作者</div>
          <div class="xhs-desc">获取更新动态和更多功能</div>
        </div>
        <div class="xhs-icons">
          <div class="qr-wrapper">
            <div class="icon-btn-circle" title="关注小红书">📕</div>
            <div class="qr-tooltip">
              <img src="/images/xhs_qr.png" class="qr-img" alt="小红书二维码">
              <div class="qr-desc">扫码关注获取更新</div>
            </div>
          </div>
          <div class="qr-wrapper">
            <div class="icon-btn-circle" title="打赏一杯奶茶">💰</div>
            <div class="qr-tooltip">
              <img src="/images/pay_qr.png" class="qr-img" alt="收款码">
              <div class="qr-desc">谢谢老板</div>
            </div>
          </div>
        </div>
      </div>

      <footer class="app-footer">
        <div>AI Translator v1.0.0</div>
        <div>&copy; 2026 BTBONN</div>
      </footer>
    </main>
  </div>
  <script src="popup.js"></script>
</body>
</html>
